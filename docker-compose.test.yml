services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: event_ticketing_test
    ports:
      - "5433:5432"
    volumes:
      - event_ticketing_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d event_ticketing_test" ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  event_ticketing_test_pgdata:
