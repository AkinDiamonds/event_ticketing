name: Backend verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/event_ticketing_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        run: npm run verify
